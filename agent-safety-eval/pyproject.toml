[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-safety-eval"
version = "0.1.0"
description = "Mock-only agent safety runtime monitor built on llm-lab EvalOps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "llm-lab contributors" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.0",
]

[project.scripts]
agent-safety-eval = "agent_safety_eval.cli:entry"

[tool.setuptools]
packages = ["agent_safety_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30

[tool.mypy]
mypy_path = ".."
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B", "SIM", "ARG", "S", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "N802", "N803", "N806", "S101"]
