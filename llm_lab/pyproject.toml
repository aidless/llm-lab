[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-lab"
version = "0.9.1"
description = "LLM orchestration and evaluation lab"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "llm-lab contributors" },
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
    "promptfoo>=0.1.0",
    "deepeval>=2.0.0",
    "langfuse>=2.0.0",
    "anthropic>=0.50.0",
    "google-genai>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/aidless/llm-lab"
Repository = "https://github.com/aidless/llm-lab"
Issues = "https://github.com/aidless/llm-lab/issues"

[project.scripts]
llm-lab = "llm_lab.cli:entry"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.0",
    "ruff>=0.8.0",
    "mypy>=1.10",
]
xlsx = [
    "openpyxl>=3.1",
]
sbom = [
    # Used by the ``sbom`` CI job to generate a CycloneDX SBOM per
    # push / PR. Build-time only; not a runtime dependency.
    "cyclonedx-bom>=7.0",
]

[tool.setuptools]
# This pyproject.toml lives INSIDE the package directory (llm_lab/), so the
# package root is this file's parent directory. Without package-dir pointing
# up one level, editable installs map to nothing and `import llm_lab` fails
# after a successful `pip install -e .` (found during the 2026-10-16 audit).
package-dir = {"" = ".."}

# Explicit list instead of [tool.setuptools.packages.find]: find's `where`
# must be inside the project root, which is llm_lab/ here -- pointing it at
# ".." is silently ignored and setuptools falls back to flat-layout
# auto-discovery (which ships llm_lab/tests/ into the wheel).
packages = ["llm_lab", "llm_lab.planner"]

# With pyproject.toml metadata, include-package-data defaults to True, which
# makes setuptools ship every git-tracked file under llm_lab/ as "package
# data" -- that pulled the whole tests/ tree and benchmarks/ into the wheel.
include-package-data = false

[tool.setuptools.package-data]
llm_lab = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
omit = [
    "tests/e2e_local.py",
]

[tool.mypy]
ignore_missing_imports = true
python_version = "3.10"
strict_optional = true
warn_unused_ignores = true
# explicit_package_bases must stay OFF: with the editable install mapping
# llm_lab via the repo root (package-dir {"": ".."}), it would name files
# twice ("observability" from the cwd base and "llm_lab.observability"
# from the site-packages path) and fail every mypy invocation. The
# default __init__.py-walk naming yields llm_lab.* consistently.

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "UP", "B", "SIM", "ARG", "S", "RUF100"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "N802", "N803", "N806", "S101"]

[tool.ruff.format]
quote-style = "double"
