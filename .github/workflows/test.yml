name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same PR/branch to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Minimal default token scope. Jobs that need write access (none
# today) must grant it explicitly. This is the GHAS-recommended
# posture — addresses CodeQL "workflow does not contain permissions".
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # The codecov step on 3.11 / ubuntu posts a comment back to the PR
    # when running on a pull_request event. That requires
    # `pull-requests: read` on the job. Other steps in this job only
    # need `contents: read` (the workflow-level default), which is a
    # subset of this so they're unaffected.
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: llm_lab

    steps:
      - uses: actions/checkout@v4

      - name: Validate documentation links
        working-directory: .
        run: python3 tools/check_knowledge_links.py

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: llm_lab/pyproject.toml

      - name: Install (core + dev + xlsx)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,xlsx]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy .

      - name: Test (pytest + coverage)
        env:
          # Dummy keys keep providers from reaching real APIs; offline tests
          # never exercise the network path. The real-provider smoke test
          # skips on unset/dummy keys, so it only runs when a real
          # OPENAI_API_KEY secret is configured.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: sk-ant-test
          GOOGLE_API_KEY: test
        run: |
          pytest --cov --cov-report=xml --cov-report=term-missing --timeout=30 -q

      - name: "Test (repo-root suite: tests/test_selfevolve.py)"
        # The job default working directory is llm_lab/, so the step above
        # collects the package suite. This step adds the repository-root
        # self-evolution suite, which previously had no CI coverage even though
        # the README badge counted it.
        working-directory: .
        run: |
          python -m pytest tests/test_selfevolve.py -q --timeout=30

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: llm_lab/coverage.xml
          fail_ci_if_error: false

  security:
    name: security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Use a throwaway venv so `pip-audit --strict` only sees llm-lab's
      # declared dependencies — never the host's global environment
      # (which may carry unrelated editable installs).
      - name: Create isolated venv
        run: python -m venv .audit-venv

      - name: Install (isolated)
        working-directory: llm_lab
        run: |
          . ../.audit-venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install bandit pip-audit

      - name: Bandit (code-level security lint)
        working-directory: llm_lab
        run: . ../.audit-venv/bin/activate && bandit -r llm_lab -ll -q

      - name: pip-audit (dependency CVE scan)
        working-directory: llm_lab
        # Extract the runtime deps from pyproject.toml into a
        # requirements-style file, install them, and audit. We do NOT
        # install llm-lab itself (editable) into this venv because
        # pip-audit fails on editable packages under --strict
        # (the package has no PyPI release to look up). Dependabot
        # (configured separately) handles the editable-source scanning
        # for this repo.
        run: |
          . ../.audit-venv/bin/activate
          python -c "
          import tomllib, sys
          data = tomllib.load(open('pyproject.toml', 'rb'))
          for dep in data['project']['dependencies']:
              # strip environment markers like '; python_version<...'
              sys.stdout.write(dep.split(';', 1)[0].strip() + '\n')
          " > /tmp/llm-lab-deps.txt
          cat /tmp/llm-lab-deps.txt
          pip install -r /tmp/llm-lab-deps.txt
          pip-audit --strict -r /tmp/llm-lab-deps.txt

  benchmark-smoke:
    name: benchmark smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: llm_lab
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm_lab/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Smoke-only: confirms the script runs and emits JSON. Full benchmark
      # requires a real LLM endpoint and is run on-demand, not on every PR.
      - name: Run benchmarks/self_bench.py --mode smoke
        env:
          OPENAI_API_KEY: sk-test
        run: |
          python benchmarks/self_bench.py --mode smoke --output benchmarks/_ci_smoke.json

      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: llm_lab/benchmarks/_ci_smoke.json

  portfolio-test:
    name: portfolio packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            llm_lab/pyproject.toml
            agent-safety-eval/pyproject.toml
            safety-judge-calibration/pyproject.toml
            benchmark-contamination-scan/pyproject.toml
            eval-infra-adapters/pyproject.toml
            kube-eval-service/pyproject.toml

      - name: Install all portfolio packages
        run: |
          python -m pip install --upgrade pip
          pip install \
            -e "./llm_lab[dev]" \
            -e "./agent-safety-eval[dev]" \
            -e "./safety-judge-calibration[dev]" \
            -e "./benchmark-contamination-scan[dev]" \
            -e "./eval-infra-adapters[dev]" \
            -e "./kube-eval-service[dev]"

      - name: Ruff
        run: |
          for project in \
            llm_lab \
            agent-safety-eval \
            safety-judge-calibration \
            benchmark-contamination-scan \
            eval-infra-adapters \
            kube-eval-service
          do
            echo "== ruff: $project"
            (cd "$project" && ruff check .)
          done

      - name: Mypy
        run: |
          for project in \
            llm_lab \
            agent-safety-eval \
            safety-judge-calibration \
            benchmark-contamination-scan \
            eval-infra-adapters \
            kube-eval-service
          do
            echo "== mypy: $project"
            (cd "$project" && mypy .)
          done

      - name: Package tests
        run: |
          for project in \
            llm_lab \
            agent-safety-eval \
            safety-judge-calibration \
            benchmark-contamination-scan \
            eval-infra-adapters \
            kube-eval-service
          do
            echo "== pytest: $project"
            (cd "$project" && pytest -q tests --timeout=30)
          done

      - name: Verify checked-in evidence
        run: |
          python agent-safety-eval/verify_evidence.py --allow-pending-human
          python safety-judge-calibration/verify_evidence.py --allow-pending-human
          python benchmark-contamination-scan/verify_evidence.py --allow-pending-human
          (cd benchmark-contamination-scan && python scripts/assert_gate_fails_closed.py --expected-report evidence/report.json)
          python eval-infra-adapters/verify_evidence.py
          python kube-eval-service/verify_evidence.py

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm_lab/pyproject.toml

      - name: Install + generate SBOM
        working-directory: llm_lab
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" cyclonedx-bom
          python -m cyclonedx_py environment \
              --output-file sbom.cdx.json \
              --spec-version 1.6 \
              --output-format JSON \
              --pyproject pyproject.toml

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: llm_lab/sbom.cdx.json

  secret-scan:
    # Full history: a key leaked in an old commit is still a live key. The CLI is
    # used rather than gitleaks-action, which needs GITHUB_TOKEN to scan pull
    # requests and so turns every Dependabot PR red for an unrelated reason --
    # and a PR runs the workflow from its own branch, so a fix on main does not
    # take effect until the branch is regenerated. Pinned, not latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          set -euo pipefail
          curl -sSfL --retry 3 -o /tmp/gitleaks.tgz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --no-banner --verbose
