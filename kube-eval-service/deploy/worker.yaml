apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-eval-worker
  namespace: eval-lab
  labels:
    app.kubernetes.io/name: kube-eval-worker
    app.kubernetes.io/part-of: eval-lab
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-eval-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-eval-worker
        app.kubernetes.io/part-of: eval-lab
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: kube-eval-service:dev
          imagePullPolicy: Never
          command: ["python", "-m", "kube_eval_service.worker"]
          envFrom:
            - configMapRef:
                name: kube-eval-config
          env:
            - name: EVAL_ROLE
              value: worker
            # This local smoke fixture leaves work visibly running long enough
            # to exercise forced worker replacement and lease recovery.
            - name: EVAL_TASK_DELAY_SECONDS
              value: "8"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kube-eval-data
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      terminationGracePeriodSeconds: 20
