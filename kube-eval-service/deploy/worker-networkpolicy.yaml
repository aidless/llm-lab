apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-eval-worker
  namespace: eval-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-eval-worker
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: eval-lab
