apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kube-eval-service
  namespace: eval-lab
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kube-eval-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: eval-lab
      ports:
        - protocol: TCP
          port: 8080
